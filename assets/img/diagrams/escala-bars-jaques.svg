<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Escala Taxonómica BARS de Martha Alles y Elliott Jaques">
  <title>Graduación Taxonómica BARS • Niveles A, B, C y D</title>
  <desc>Escala objetiva de 4 grados conductuales basada en autonomía, horizonte temporal e impacto organizacional.</desc>
  <defs>
    <filter id="stepShadow" x="-3%" y="-5%" width="106%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="1.2">TAXONOMÍA DE COMPORTAMIENTOS • ELLIOTT JAQUES &amp; MARTHA ALLES</text>
  <text x="400" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A">Escala BARS (Behaviorally Anchored Rating Scales)</text>

  <!-- Step A -->
  <g transform="translate(40, 75)" filter="url(#stepShadow)">
    <rect width="720" height="52" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#0F766E"/>
    <text x="40" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">A</text>
    <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0F766E">GRADO A • NIVEL SISTÉMICO / BENCHMARK (100%)</text>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Modela conductas para toda la organización, diseña políticas corporativas y crea nuevos estándares de industria.</text>
    <rect x="620" y="12" width="88" height="28" rx="4" fill="#CCFBF1"/>
    <text x="664" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0F766E">Estratégico</text>
  </g>

  <!-- Step B -->
  <g transform="translate(40, 137)" filter="url(#stepShadow)">
    <rect width="720" height="52" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#0D9488"/>
    <text x="40" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">B</text>
    <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0D9488">GRADO B • NIVEL TÁCTICO / AUTÓNOMO (75%)</text>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Lidera la implementación entre áreas de trabajo; resuelve contingencias complejas sin requerir supervisión de su jefatura.</text>
    <rect x="620" y="12" width="88" height="28" rx="4" fill="#F0FDFA"/>
    <text x="664" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0D9488">Táctico</text>
  </g>

  <!-- Step C -->
  <g transform="translate(40, 199)" filter="url(#stepShadow)">
    <rect width="720" height="52" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#14B8A6"/>
    <text x="40" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">C</text>
    <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0F766E">GRADO C • ESTÁNDAR OPERATIVO REQUERIDO (50%)</text>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Ejecuta consistentemente las responsabilidades de su rol; cumple protocolos establecidos con autonomía funcional estándar.</text>
    <rect x="620" y="12" width="88" height="28" rx="4" fill="#F0FDFA"/>
    <text x="664" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#0F766E">Requerido</text>
  </g>

  <!-- Step D -->
  <g transform="translate(40, 261)" filter="url(#stepShadow)">
    <rect width="720" height="52" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <rect x="0" y="0" width="80" height="52" rx="8" fill="#64748B"/>
    <text x="40" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">D</text>
    <text x="95" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#475569">GRADO D • NIVEL INICIAL / EN DESARROLLO (25%)</text>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748B">Presenta dificultades para estabilizar la conducta o requiere supervisión directa y coaching continuo para cumplir el estándar.</text>
    <rect x="620" y="12" width="88" height="28" rx="4" fill="#F1F5F9"/>
    <text x="664" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748B">Inicial</text>
  </g>
</svg>
