<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="STAR Methodology and Alles Behavioral Probing">
  <title>The STAR Funnel and Probing Protocol (BBI)</title>
  <desc>Structured inquiry flowchart: Situation, Task, Action, Result, and probing technique for evasive answers.</desc>
  <defs>
    <filter id="starShadowEn" x="-3%" y="-5%" width="106%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="300" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F766E" letter-spacing="1.2">BEHAVIORAL INQUIRY TECHNIQUE • ALLES VOLUME III</text>
  <text x="400" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#0F172A">The STAR Funnel and Behavioral Probing</text>

  <!-- S -->
  <g transform="translate(30, 80)" filter="url(#starShadowEn)">
    <rect width="170" height="110" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#0F766E"/>
    <text x="85" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">S • SITUATION</text>
    <text x="15" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Historical Context</text>
    <text x="15" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">When did it happen?</text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Which firm / client?</text>
  </g>

  <!-- Arrow 1 -->
  <text x="212" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#0F766E">→</text>

  <!-- T -->
  <g transform="translate(225, 80)" filter="url(#starShadowEn)">
    <rect width="170" height="110" rx="8" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#0D9488"/>
    <text x="85" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">T • TASK</text>
    <text x="15" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Challenge or Objective</text>
    <text x="15" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">What was the obstacle?</text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">What was your role?</text>
  </g>

  <!-- Arrow 2 -->
  <text x="407" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#0D9488">→</text>

  <!-- A -->
  <g transform="translate(420, 80)" filter="url(#starShadowEn)">
    <rect width="170" height="110" rx="8" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="30" rx="8" fill="#14B8A6"/>
    <text x="85" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">A • ACTION</text>
    <text x="15" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Concrete Behavior</text>
    <text x="15" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">What did you do alone?</text>
    <text x="15" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F766E">Dismantle the "we"</text>
  </g>

  <!-- Arrow 3 -->
  <text x="602" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#14B8A6">→</text>

  <!-- R -->
  <g transform="translate(615, 80)" filter="url(#starShadowEn)">
    <rect width="155" height="110" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="0" y="0" width="155" height="30" rx="8" fill="#0F766E"/>
    <text x="77" y="20" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">R • RESULT</text>
    <text x="12" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Impact and Metrics</text>
    <text x="12" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">How did it conclude?</text>
    <text x="12" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Metrics or deliverables</text>
  </g>

  <!-- Bottom: Probing / Sondeo Technique -->
  <g transform="translate(30, 205)">
    <rect width="740" height="70" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#B45309">AUDIT PROTOCOL: WHAT TO DO WHEN FACING VAGUE ANSWERS?</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400E">If the candidate uses the corporate plural ("as a team we solved...") or offers theoretical intentions:</text>
    <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F766E">
      ➔ Apply probing question: "What was your exact personal contribution in that meeting and what specific decision did you make?"
    </text>
  </g>
</svg>
