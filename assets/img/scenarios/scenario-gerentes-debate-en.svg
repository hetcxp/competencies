<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Calibration Committee: War of the Managers">
  <title>Calibration Committee Dilemma • War of the Managers</title>
  <desc>Evaluation committee scene where two managers dispute over subjective adjectives versus objective BARS graduation.</desc>
  <defs>
    <filter id="debateShadowEn" x="-3%" y="-5%" width="106%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="260" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="380" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F766E" letter-spacing="1">CALIBRATION COMMITTEE • CASE STUDY</text>
  <text x="380" y="48" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#0F172A">Dilema: Adjective Rating Dispute</text>

  <!-- Left Manager: Commercial (Subjective) -->
  <g transform="translate(30, 65)" filter="url(#debateShadowEn)">
    <rect width="320" height="170" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="32" rx="8" fill="#FEF3C7"/>
    <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#B45309">COMMERCIAL MANAGER (SUBJECTIVE)</text>

    <text x="16" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">"Must be Grade A (Outstanding)"</text>
    <rect x="16" y="65" width="288" height="54" rx="4" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="24" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic" fill="#92400E">"He is super proactive, brings great vibes</text>
    <text x="24" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic" fill="#92400E">to the team, and stays late every evening."</text>

    <!-- Error label -->
    <rect x="16" y="128" width="288" height="26" rx="4" fill="#FEE2E2"/>
    <text x="160" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#DC2626">ERROR: Subjective / popularity rating</text>
  </g>

  <!-- VS in center -->
  <circle cx="380" cy="150" r="20" fill="#0F766E"/>
  <text x="380" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">VS</text>

  <!-- Right Manager: Operations (Objective BARS) -->
  <g transform="translate(410, 65)" filter="url(#debateShadowEn)">
    <rect width="320" height="170" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="32" rx="8" fill="#F0FDFA"/>
    <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#0F766E">OPERATIONS MANAGER (CRITICAL)</text>

    <text x="16" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E293B">"Doesn't even qualify for Grade B"</text>
    <rect x="16" y="65" width="288" height="54" rx="4" fill="#F8FAFC" stroke="#CCFBF1" stroke-width="1"/>
    <text x="24" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic" fill="#334155">"Requires constant supervisor guidance whenever</text>
    <text x="24" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-style="italic" fill="#334155">a client raises a technical objection."</text>

    <!-- Correct criterion label -->
    <rect x="16" y="128" width="288" height="26" rx="4" fill="#ECFDF5"/>
    <text x="160" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" fill="#059669">CORRECT CRITERION: Real Autonomy Level</text>
  </g>
</svg>
