<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Caso Novatech S.A. y la Inflación de Calificaciones">
  <title>Caso Novatech S.A. • La Ilusión del 94%</title>
  <desc>Infografía del dilema Novatech: 94% sobresaliente en evaluaciones versus proyectos colapsados en la realidad.</desc>
  <defs>
    <linearGradient id="novatechBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="260" rx="10" fill="url(#novatechBg)"/>

  <!-- Left: Corporate Dossier / Crisis Badge -->
  <g transform="translate(30, 25)">
    <rect width="130" height="26" rx="4" fill="#334155"/>
    <text x="65" y="17" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94A3B8" letter-spacing="1">CASO AUDITORÍA</text>
    <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Novatech S.A.</text>
    <text x="0" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">El Síndrome del Diccionario Copiado</text>

    <rect x="0" y="95" width="220" height="120" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="12" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#F87171">PARADOJA ORGANIZACIONAL:</text>
    <text x="12" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">• Evaluación: 94% "Sobresaliente"</text>
    <text x="12" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">• Realidad: 4 proyectos cancelados</text>
    <text x="12" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#CBD5E1">• Causa: Catálogo bajado de la web</text>
    <text x="12" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">Cero conductas observables</text>
  </g>

  <!-- Right: Data Visualization (Gauss Curve vs. Reality) -->
  <g transform="translate(290, 25)">
    <rect width="440" height="210" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="220" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">DISTRIBUCIÓN DE CALIFICACIONES DE DESEMPEÑO</text>

    <!-- Normal Distribution Baseline (Dashed) -->
    <path d="M 40 170 Q 150 170 200 65 Q 250 170 380 170" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="200" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Curva Gaussiana Esperada</text>

    <!-- Distorted Reality in Novatech: Massive Spike at 94% (Red/Alert) -->
    <path d="M 40 170 Q 260 170 310 160 Q 350 30 370 170" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="3"/>
    
    <!-- Big 94% Badge -->
    <g transform="translate(320, 20)">
      <rect width="90" height="34" rx="6" fill="url(#alertGrad)"/>
      <text x="45" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">94% SOB</text>
    </g>

    <!-- Axis and ticks -->
    <line x1="30" y1="170" x2="410" y2="170" stroke="#64748B" stroke-width="1.5"/>
    <text x="40" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Insuficiente</text>
    <text x="140" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">En Desarrollo</text>
    <text x="250" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Estándar</text>
    <text x="350" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#F87171">Sobresaliente</text>
  </g>
</svg>
